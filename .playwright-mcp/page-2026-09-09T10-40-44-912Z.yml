        - generic [ref=f20e761]:
          - button "What if someone's phone doesn't support NFC?" [ref=f20e762]
          - paragraph [ref=f20e767]: No problem. Every EdgeTap has a QR fallback that points to the same URL, so anyone can still reach your digital experience from any phone.
        - generic [ref=f20e768]:
          - button "Can I change my information later?" [ref=f20e769]
          - paragraph [ref=f20e774]: Yes — your digital profile is always up to date. Update your links, menu, or details whenever you like, and the physical card keeps working exactly the same.
        - generic [ref=f20e775]:

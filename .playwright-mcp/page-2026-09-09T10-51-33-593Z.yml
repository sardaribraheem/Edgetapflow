          - paragraph [ref=f24e677]: Tap the physical EdgeTap card against any modern smartphone. It instantly opens your digital profile or experience in the browser — no app, no pairing, no friction.
        - generic [ref=f24e678]:
          - button "What if someone's phone doesn't support NFC?" [ref=f24e679]
          - paragraph [ref=f24e684]: No problem. Every EdgeTap has a QR fallback that points to the same URL, so anyone can still reach your digital experience from any phone.
        - generic [ref=f24e685]:
          - button "Can I change my information later?" [ref=f24e686]
          - paragraph [ref=f24e691]: Yes — your digital profile is always up to date. Update your links, menu, or details whenever you like, and the physical card keeps working exactly the same.
        - generic [ref=f24e692]:

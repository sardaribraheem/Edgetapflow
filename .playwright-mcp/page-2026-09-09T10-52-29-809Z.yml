          - button "How does the NFC card work?" [expanded] [ref=f25e750]
          - paragraph [ref=f25e757]: Tap the physical EdgeTap card against any modern smartphone. It instantly opens your digital profile or experience in the browser — no app, no pairing, no friction.
        - generic [ref=f25e758]:
          - button "What if someone's phone doesn't support NFC?" [ref=f25e759]
          - paragraph [ref=f25e764]: No problem. Every EdgeTap has a QR fallback that points to the same URL, so anyone can still reach your digital experience from any phone.
        - generic [ref=f25e765]:
          - button "Can I change my information later?" [ref=f25e766]
          - paragraph [ref=f25e771]: Yes — your digital profile is always up to date. Update your links, menu, or details whenever you like, and the physical card keeps working exactly the same.
        - generic [ref=f25e772]:
          - button "Do I need an app?" [ref=f25e773]
          - paragraph [ref=f25e778]: No. EdgeTap is an open-web experience. Your visitors tap and land straight in the browser. There's nothing to download on either side.
        - generic [ref=f25e779]:
          - button "Can you build custom NFC solutions?" [ref=f25e780]
          - paragraph [ref=f25e785]: Absolutely. Beyond cards and menus, we design and build custom physical → digital experiences for your business. Tell us your idea and we'll build it.
        - generic [ref=f25e786]:

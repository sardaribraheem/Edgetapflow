          - paragraph [ref=f28e764]: No problem. Every EdgeTap has a QR fallback that points to the same URL, so anyone can still reach your digital experience from any phone.
        - generic [ref=f28e765]:
          - button "Can I change my information later?" [ref=f28e766]
          - paragraph [ref=f28e771]: Yes — your digital profile is always up to date. Update your links, menu, or details whenever you like, and the physical card keeps working exactly the same.
        - generic [ref=f28e772]:

          - paragraph [ref=f26e757]: Tap the physical EdgeTap card against any modern smartphone. It instantly opens your digital profile or experience in the browser — no app, no pairing, no friction.
        - generic [ref=f26e758]:
          - button "What if someone's phone doesn't support NFC?" [ref=f26e759]
          - paragraph [ref=f26e764]: No problem. Every EdgeTap has a QR fallback that points to the same URL, so anyone can still reach your digital experience from any phone.
        - generic [ref=f26e765]:
          - button "Can I change my information later?" [ref=f26e766]
          - paragraph [ref=f26e771]: Yes — your digital profile is always up to date. Update your links, menu, or details whenever you like, and the physical card keeps working exactly the same.
        - generic [ref=f26e772]:
          - button "Do I need an app?" [ref=f26e773]
          - paragraph [ref=f26e778]: No. EdgeTap is an open-web experience. Your visitors tap and land straight in the browser. There's nothing to download on either side.

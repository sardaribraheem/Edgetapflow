          - paragraph [ref=f21e757]: Tap the physical EdgeTap card against any modern smartphone. It instantly opens your digital profile or experience in the browser — no app, no pairing, no friction.
        - generic [ref=f21e758]:
          - button "What if someone's phone doesn't support NFC?" [ref=f21e759]
          - paragraph [ref=f21e764]: No problem. Every EdgeTap has a QR fallback that points to the same URL, so anyone can still reach your digital experience from any phone.
        - generic [ref=f21e765]:
          - button "Can I change my information later?" [ref=f21e766]
          - paragraph [ref=f21e771]: Yes — your digital profile is always up to date. Update your links, menu, or details whenever you like, and the physical card keeps working exactly the same.
        - generic [ref=f21e772]:
          - button "Do I need an app?" [ref=f21e773]
          - paragraph [ref=f21e778]: No. EdgeTap is an open-web experience. Your visitors tap and land straight in the browser. There's nothing to download on either side.
        - generic [ref=f21e779]:
